<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>The Nonstop Ibiza Experience</title>
    <link rel="icon" href="data:,">
    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #shell {
        position: fixed;
        inset: 0;
        background: #000;
      }

      #screen {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        background: #000;
        transition: opacity .8s ease;
      }

      #screen.screen--visible {
        opacity: 1;
      }

      .gate {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        color: #bcd;
        background-color: #000;
        background-image:
          radial-gradient(circle at 50% 43%, transparent 0%, rgb(0 0 0 / 8%) 52%, rgb(0 0 0 / 58%) 100%),
          linear-gradient(180deg, transparent 0%, rgb(0 0 0 / 10%) 58%, rgb(0 0 0 / 72%) 100%),
          url("data/x15.jpg");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        font: 13px/1.7 Arial, Helvetica, sans-serif;
        letter-spacing: .06em;
        text-align: center;
        user-select: none;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        transition: opacity .6s ease, visibility 0s;
      }

      .gate--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity .6s ease, visibility 0s .6s;
      }

      .gate__content {
        position: absolute;
        top: 50%;
        left: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(720px, calc(100% - 56px - env(safe-area-inset-left) - env(safe-area-inset-right)));
        transform: translate(-50%, -55%);
      }

      .gate h1 {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        max-width: 100%;
        font-family: "Rockwell Extra Bold", Rockwell, "Arial Black", Arial, sans-serif;
        font-weight: 900;
        text-transform: lowercase;
        transform: rotate(-4deg);
        transform-origin: 50% 50%;
      }

      .gate__title-small,
      .gate__title-main {
        position: relative;
        display: block;
        isolation: isolate;
      }

      .gate__title-small::before,
      .gate__title-main::before {
        position: absolute;
        inset: 0;
        z-index: -1;
        content: attr(data-text);
        color: #030303;
        pointer-events: none;
        -webkit-text-fill-color: #030303;
        -webkit-text-stroke: 0;
        transform: translate(.055em, .075em);
      }

      .gate__title-small {
        color: #f7f7f3;
        font-size: clamp(24px, min(7vmin, 8vh), 48px);
        font-weight: 900;
        letter-spacing: -.025em;
        line-height: .84;
        -webkit-text-stroke: 1px #050505;
        paint-order: stroke fill;
        text-shadow: none;
      }

      .gate__title-main {
        color: #f7f7f3;
        font-size: clamp(36px, min(14vmin, 13.333vh), 116px);
        font-weight: 900;
        letter-spacing: -.055em;
        line-height: .74;
        white-space: nowrap;
        -webkit-text-stroke: 2px #050505;
        paint-order: stroke fill;
        text-shadow: none;
      }

      .gate__accent {
        color: #ef281b;
        -webkit-text-stroke-color: #050505;
      }

      .gate__title-small:first-child {
        transform: rotate(.8deg);
      }

      .gate__title-main:nth-child(2) {
        transform: rotate(.45deg);
      }

      .gate__title-main:nth-child(3) {
        transform: rotate(-.7deg) scale(1.06);
        transform-origin: center;
      }

      .gate__title-small:nth-child(4) {
        transform: rotate(.55deg);
      }

      .gate__title-small + .gate__title-main,
      .gate__title-main + .gate__title-small {
        margin-top: 10px;
      }

      .gate__title-main + .gate__title-main {
        margin-top: .04em;
      }

      .gate__by {
        margin-top: 32px;
        color: #ef281b;
        font: 900 18px/1 "Rockwell Extra Bold", Rockwell, "Arial Black", Arial, sans-serif;
        letter-spacing: .08em;
        text-transform: lowercase;
        text-shadow: 2px 2px 0 #000;
      }

      .gate__meta {
        margin-top: 4px;
        color: #aab6c4;
      }

      .gate__credits {
        margin-top: 22px;
        color: #98a8ba;
        font-size: 12px;
      }

      .gate__credits b {
        color: #d8dad4;
        font-weight: 400;
      }

      .gate__row {
        position: relative;
        margin-top: 38px;
      }

      .gate__loading {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 0;
        display: block;
        width: 180px;
        height: 180px;
        image-rendering: auto;
        mix-blend-mode: plus-lighter;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }

      .gate--ready .gate__loading,
      .gate--error .gate__loading {
        display: none;
      }

      .gate__button {
        position: relative;
        z-index: 1;
        padding: 6px 2px;
        border: 0;
        outline: 0;
        color: #e6e7df;
        background: none;
        font: inherit;
        letter-spacing: .18em;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 7px;
        text-transform: uppercase;
        cursor: pointer;
        transition: color .2s ease;
      }

      .gate__button:not(:disabled):hover,
      .gate__button:not(:disabled):focus-visible {
        color: #ef4135;
      }

      .gate__button:focus-visible {
        outline: 1px solid rgb(255 255 255 / 55%);
        outline-offset: 7px;
      }

      .gate__button:disabled {
        color: #6d86a6;
        cursor: progress;
        text-decoration: none;
      }

      .gate__controls {
        position: absolute;
        right: max(18px, env(safe-area-inset-right));
        bottom: max(22px, env(safe-area-inset-bottom));
        left: max(18px, env(safe-area-inset-left));
        margin: 0;
        color: #4f6784;
        font-size: 11px;
        letter-spacing: .14em;
        line-height: 1.5;
        text-align: center;
        white-space: nowrap;
      }

      .gate__controls kbd {
        color: #9fb6d4;
        font: inherit;
      }

      .gate__controls a {
        display: inline-block;
        margin-top: 10px;
        color: #6d86a6;
        text-decoration: none;
        transition: color .2s ease;
      }

      .gate__controls a:hover,
      .gate__controls a:focus-visible {
        color: #9fb6d4;
      }

      #status {
        position: absolute;
        bottom: max(12px, env(safe-area-inset-bottom));
        left: max(14px, env(safe-area-inset-left));
        z-index: 2;
        max-width: calc(100% - 28px);
        margin: 0;
        color: #718394;
        font: 11px/1.4 Arial, Helvetica, sans-serif;
        letter-spacing: .1em;
        pointer-events: none;
        text-shadow: 0 1px 4px #000;
      }

      #status:empty {
        display: none;
      }

      .gate--error {
        background: rgb(0 0 0 / 92%);
      }

      .gate--error ~ #status {
        color: #fff;
        white-space: normal;
      }

      @media (max-width: 600px) {
        #status {
          top: max(12px, env(safe-area-inset-top));
          bottom: auto;
        }
      }

      @media (max-width: 480px) {
        .gate__credits {
          min-width: 0;
          max-width: 100%;
        }

        .gate__controls {
          right: max(8px, env(safe-area-inset-right));
          left: max(8px, env(safe-area-inset-left));
          font-size: 9px;
          letter-spacing: .08em;
          white-space: normal;
        }
      }

      @media (max-height: 480px) {
        .gate__content {
          transform: translate(-50%, -59.5%);
        }

        .gate__by {
          margin-top: 20px;
        }

        .gate__credits {
          margin-top: 10px;
          line-height: 1.45;
        }

        .gate__row {
          margin-top: 8px;
        }

        .gate__button {
          padding-block: 3px;
        }
      }

      @media (min-height: 321px) and (max-height: 370px) {
        .gate__by {
          margin-top: 14px;
          font-size: 14px;
        }

        .gate__meta {
          font-size: 10px;
          line-height: 1.2;
        }

        .gate__credits {
          margin-top: 5px;
          font-size: 9px;
          line-height: 1.2;
        }

        .gate__row {
          margin-top: 5px;
        }

        .gate__button {
          padding-block: 1px;
          line-height: 1.3;
        }

        .gate__controls a {
          margin-top: 6px;
        }
      }

      @media (max-height: 320px) {
        .gate__content {
          transform: translate(-50%, -55.5%);
        }

        .gate__by {
          margin-top: 4px;
          font-size: 12px;
          line-height: 1.15;
        }

        .gate__meta {
          margin-top: 2px;
          font-size: 10px;
          line-height: 1.2;
        }

        .gate__credits {
          margin-top: 3px;
          font-size: 9px;
          line-height: 1.15;
        }

        .gate__row {
          margin-top: 5px;
        }

        .gate__button {
          padding-block: 1px;
          line-height: 1.3;
        }

        .gate__controls {
          right: 4px;
          bottom: 3px;
          left: 4px;
          font-size: 8px;
          letter-spacing: .08em;
          line-height: 1.3;
        }

        .gate__controls a {
          margin-top: 3px;
        }

        #status {
          top: 4px;
          bottom: auto;
          left: 6px;
          font-size: 9px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #screen,
        .gate,
        .gate__button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="shell">
      <canvas id="screen" width="512" height="384" aria-label="The Nonstop Ibiza Experience"></canvas>
      <section id="gate" class="gate">
        <div class="gate__content">
          <h1 aria-label="the nonstop ibiza experience">
            <span class="gate__title-small" data-text="the">the</span>
            <span class="gate__title-main" data-text="nonstop">nonsto<span class="gate__accent">p</span></span>
            <span class="gate__title-main" data-text="ibiza">ibiz<span class="gate__accent">a</span></span>
            <span class="gate__title-small" data-text="experience">experienc<span class="gate__accent">e</span></span>
          </h1>
          <div class="gate__by">orange</div>
          <div class="gate__meta">demo · assembly 2000</div>
          <div class="gate__credits">
            <b>hoplite</b> programming<br>
            <b>dune</b> music + additional programming<br>
            <b>derpiipo</b> graphics
          </div>
          <div class="gate__row">
            <canvas id="loading-preview" class="gate__loading" width="240" height="240" aria-hidden="true"></canvas>
            <button id="start" class="gate__button" type="button" disabled>LOADING</button>
          </div>
        </div>
        <p class="gate__controls"><kbd>space</kbd> pause · <kbd>← →</kbd> seek · <kbd>f</kbd> fullscreen · <kbd>esc</kbd> stop<br>
          <a href="https://github.com/demoports/ibiza" target="_blank" rel="noopener noreferrer">github</a>
        </p>
      </section>
      <p id="status" aria-live="polite" aria-atomic="true" aria-busy="true"></p>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
